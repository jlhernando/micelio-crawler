</style></head><body><header class="lab"><span>Micelio / exploración de interfaz</span><div class="switch" aria-label="Elegir propuesta"><button data-theme="resend">01 · Resend</button><button data-theme="router">02 · OpenRouter</button><button data-theme="apple">03 · Apple</button></div><small>Prototipo · datos ficticios</small></header><div id="app"></div><dialog id="detail"><button class="close" onclick="document.getElementById('detail').close()" aria-label="Cerrar detalle">✕</button><div id="detailbody"></div></dialog>
<script>
const issues=[{name:'Enlaces internos rotos',count:24,level:'Crítica',desc:'Llevan a páginas que devuelven un error 404.',action:'Actualiza los enlaces de origen o recupera la página de destino.',paths:['/colecciones/verano','/producto/mesa-roble'],status:'404',type:'Enlaces'},{name:'Páginas sin enlaces de entrada',count:18,level:'Alta',desc:'Encontradas en el sitemap, sin enlaces internos.',action:'Enlaza estas páginas desde categorías o contenido relacionado.',paths:['/guias/materiales','/guias/cuidados'],status:'200',type:'Enlaces'},{name:'Títulos duplicados',count:36,level:'Media',desc:'Varias páginas comparten el mismo título.',action:'Escribe un título específico para cada página que deba indexarse.',paths:['/sillas/nordica','/sillas/nordica-natural'],status:'200',type:'Contenido'}];
const rows=[['/colecciones/verano','404','No','Enlace roto','Crítica'],['/producto/mesa-roble','404','No','Enlace roto','Crítica'],['/guias/materiales','200','Sí','Sin enlaces de entrada','Alta'],['/guias/cuidados','200','Sí','Sin enlaces de entrada','Alta'],['/sillas/nordica','200','Sí','Título duplicado','Media'],['/sillas/nordica-natural','200','Sí','Título duplicado','Media']];
let theme='apple',category='Todas';
const issueRows=()=>issues.filter(i=>category==='Todas'||i.level===category||i.type===category).map(i=>`<button class="issue" onclick="showIssue(${issues.indexOf(i)})"><span class="severity">${i.level==='Crítica'?'!':'↗'}</span><span><strong>${i.name}</strong><small>${i.desc}</small>${theme==='router'?`<small>${i.level} · ${i.type} · Ver diagnóstico →</small>`:''}</span><span class="count">${i.count}<small>URL →</small></span></button>`).join('');
const coverage=()=>`<div class="panel"><div class="panelhead"><h2>Cobertura de indexación</h2><small>1.248 URL</small></div>${theme==='apple'?'<div class="bigcount">91,3<span>% indexables</span></div>':'<p>1.140 páginas pueden indexarse</p>'}<div class="bar" role="img" aria-label="1.140 indexables, 84 excluidas y 24 con error"><i style="width:91.35%;background:var(--green)"></i><i style="width:6.73%;background:#c1a36f"></i><i style="width:1.92%;background:var(--red)"></i></div><div class="legend"><span>Indexables</span><b>1.140</b></div><div class="legend"><span>Excluidas por directivas</span><b>84</b></div><div class="legend"><span>Con error HTTP</span><b>24</b></div><p class="footnote">Ser indexable no garantiza aparecer en Google.</p></div>`;
const stats=()=>`<section class="stats" aria-label="Resumen del rastreo"><div class="stat"><small>Páginas rastreadas</small><strong>1.248</strong><small>Alcance del análisis</small></div><div class="stat"><small>Indexables</small><strong>91,3<span style="font-size:18px">%</span></strong><small>1.140 de 1.248 URL</small></div><div class="stat"><small>URL con error HTTP</small><strong class="bad">24</strong><small>Requieren revisión</small></div><div class="stat"><small>Respuesta mediana</small><strong>284 <span style="font-size:16px">ms</span></strong><small>p90 · 890 ms</small></div></section>`;
const table=()=>`<section class="panel tablepanel"><div class="panelhead"><h2>Páginas para revisar</h2><small id="resultcount">6 ejemplos</small></div><div class="toolbar"><label class="sr" for="search">Buscar URL</label><input id="search" placeholder="Buscar por URL o problema…" oninput="filterRows()"><label class="sr" for="severity">Prioridad</label><select id="severity" onchange="filterRows()"><option value="">Todas las prioridades</option><option>Crítica</option><option>Alta</option><option>Media</option></select><button onclick="downloadCSV()">Exportar CSV ↓</button></div><div class="tablewrap"><table><thead><tr><th>URL</th><th>HTTP</th><th>INDEXABLE</th><th>PROBLEMA</th><th>PRIORIDAD</th></tr></thead><tbody id="rows"></tbody></table></div><p class="footnote">Muestra de 6 URL · Los recuentos superiores representan el rastreo ficticio completo.</p></section>`;
const rationale=()=>`<details class="decision"><summary>Por qué se muestra así · decisiones por componente</summary><table><thead><tr><th>Componente</th><th>Información esencial y presentación</th></tr></thead><tbody>${[['Contexto','Dominio, fecha y estado del rastreo siempre visibles. Duración en segundo plano; la velocidad importa durante el rastreo, no al decidir qué corregir.'],['Resumen','Alcance, indexabilidad, errores HTTP y respuesta mediana. Cada cifra conserva unidad y denominador. Minigráficos con siete rastreos ficticios; comparación contra el 12 de octubre.'],['Incidencias','Problema, prioridad, cantidad de URL y siguiente acción. El detalle explica la causa y ofrece ejemplos. Los recuentos pueden solaparse; no se suman como páginas únicas.'],['Cobertura','Anillo proporcional para comparar indexables, excluidas y errores. Etiquetas y cifras evitan depender del color. No confunde indexabilidad con indexación real.'],['Tabla','URL, HTTP, indexabilidad, problema y prioridad. Búsqueda y filtro funcionan juntos. Canonical, títulos y enlaces entrantes irían al detalle de URL.'],['Evolución','Área con dos series y eje desde cero. Muestra crecimiento del sitio y cobertura indexable; el selector cambia entre cuatro y siete rastreos ficticios.'],['Rendimiento','Columnas con intervalos de respuesta, recuentos y escala desde cero. La mediana y p90 resumen el rendimiento sin ocultar las URL lentas.'],['Tipos y secciones','Circular con cuatro categorías excluyentes que suman 1.248 URL. Barras apiladas por sección con escala común para comparar volumen y problemas.'],['Análisis avanzado','Contenido, rendimiento, enlaces y visibilidad IA pertenecen a vistas específicas. Grafo, nubes y distribuciones aparecen cuando ayudan a investigar una pregunta.'],['Estados','En producción: carga con estructura estable; vacío con siguiente acción; errores con reintento; datos ausentes como “Sin datos”, nunca como cero.'],['Dirección visual',theme==='resend'?'Resend: navegación lateral estable, líneas finas, densidad alta y contraste oscuro. Adecuada para uso diario.':theme==='router'?'OpenRouter: fondo claro, acentos violeta y paneles comparables. Lectura analítica con datos en primer plano.':'Apple: índice de cobertura como protagonista, anillo sin cifra duplicada, histórico en un bloque panorámico oscuro y tarjetas asimétricas de velocidad y acción. Tipos y secciones se despliegan para investigar. Reduce la información simultánea y cambia el recorrido de lectura.']].map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')}</tbody></table><p>Referencias consultadas: <a href="https://mobbin.com/screens/7e2dfc6e-1c06-43c0-b82e-22472250711e">Resend · métricas</a> · <a href="https://mobbin.com/screens/aa985f8d-ce27-4937-a49c-0bb431711233">Resend · tabla</a> · <a href="https://mobbin.com/screens/88bebc9b-ff6b-4994-bfd2-4327d50450fc">Apple · tarjetas</a> · <a href="https://openrouter.ai/models">OpenRouter · catálogo</a> · <a href="https://mobbin.com/screens/890e0d84-2b19-4268-8c88-a88642bdf9d9">fal · filtros, resultado alternativo de Mobbin</a>.</p><p>Prototipos de resultados con datos ficticios. Navegación lateral orientativa. Búsqueda, filtros, detalles, exportación y selector de propuesta funcionales. Sin conexión al motor de rastreo.</p></details>`;
const historyData={dates:['07 sep','14 sep','21 sep','28 sep','05 oct','12 oct','18 oct'],total:[920,984,1036,1080,1148,1200,1248],index:[770,850,902,960,1030,1094,1140],errors:[52,48,41,38,32,28,24],response:[420,390,362,340,315,300,284]};
let period=7;
function spark(values,color){const min=Math.min(...values),max=Math.max(...values);const points=values.map((v,i)=>`${i*30},${36-(v-min)/(max-min||1)*30}`).join(' ');return `<svg class="spark" viewBox="0 0 180 42" aria-hidden="true"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/></svg>`}
const visualStats=()=>`<section class="stats" aria-label="Estadísticas del último rastreo">${[['Páginas rastreadas','1.248','+48 frente al 12 oct',historyData.total,'var(--blue)'],['Indexables','91,3%','+0,2 puntos frente al 12 oct',historyData.index.map((v,i)=>v/historyData.total[i]*100),'var(--green)'],['Errores HTTP','24','4 menos frente al 12 oct',historyData.errors,'var(--red)'],['Respuesta mediana','284 ms','16 ms menos frente al 12 oct',historyData.response,'var(--purple)']].map(([label,val,note,series,col])=>`<div class="stat"><small>${label}</small><strong>${val}</strong>${spark(series,col)}<small>${note}</small></div>`).join('')}</section>`;
function evolution(){let dates=historyData.dates.slice(-period),total=historyData.total.slice(-period),index=historyData.index.slice(-period);const x=i=>48+i*572/(dates.length-1),y=v=>214-v/1400*184;const line=arr=>arr.map((v,i)=>`${x(i)},${y(v)}`).join(' ');return `<article class="panel trend"><div class="panelhead"><div><h2>Evolución de la cobertura</h2><p class="chartsub">URL rastreadas e indexables · histórico de ejemplo</p></div><div class="range" aria-label="Rango del gráfico">${[4,7].map(n=>`<button aria-pressed="${period===n}" onclick="setPeriod(${n})">${n} rastreos</button>`).join('')}</div></div><div class="chartkey"><span><i style="background:var(--blue)"></i>Rastreadas <b>1.248</b></span><span><i style="background:var(--green)"></i>Indexables <b>1.140</b></span></div><svg viewBox="0 0 660 252" role="img" aria-label="${dates.map((d,i)=>d+': '+total[i]+' rastreadas, '+index[i]+' indexables').join('; ')}"><defs><linearGradient id="areaBlue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--blue)" stop-opacity=".25"/><stop offset="1" stop-color="var(--blue)" stop-opacity=".02"/></linearGradient><linearGradient id="areaGreen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--green)" stop-opacity=".2"/><stop offset="1" stop-color="var(--green)" stop-opacity=".02"/></linearGradient></defs>${[0,350,700,1050,1400].map(v=>`<line x1="48" x2="620" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="38" y="${y(v)+4}" text-anchor="end">${v.toLocaleString('es')}</text>`).join('')}<polygon points="48,214 ${line(total)} 620,214" fill="url(#areaBlue)"/><polygon points="48,214 ${line(index)} 620,214" fill="url(#areaGreen)"/><polyline points="${line(total)}" fill="none" stroke="var(--blue)" stroke-width="3"/><polyline points="${line(index)}" fill="none" stroke="var(--green)" stroke-width="3"/>${dates.map((d,i)=>`<circle cx="${x(i)}" cy="${y(total[i])}" r="4" fill="var(--blue)"><title>${d}: ${total[i]} URL rastreadas</title></circle><circle cx="${x(i)}" cy="${y(index[i])}" r="4" fill="var(--green)"><title>${d}: ${index[i]} URL indexables</title></circle><text x="${x(i)}" y="242" text-anchor="middle">${d}</text>`).join('')}</svg></article>`}
function ring(){let counts=[1140,84,24],names=['Indexables','Excluidas','Error HTTP'],colors=['var(--green)','var(--amber)','var(--red)'],offset=0;return `<article class="panel coverage"><div class="panelhead"><h2>Indexabilidad</h2><small>1.248 URL</small></div><div class="ringwrap"><svg viewBox="0 0 220 220" role="img" aria-label="1140 indexables, 84 excluidas, 24 con error HTTP">${counts.map((n,i)=>{let length=n/1248*100;const c=`<circle cx="110" cy="110" r="82" fill="none" stroke="${colors[i]}" stroke-width="23" pathLength="100" stroke-dasharray="${length} ${100-length}" stroke-dashoffset="${-offset}" transform="rotate(-90 110 110)"><title>${names[i]}: ${n} URL</title></circle>`;offset+=length;return c}).join('')}<text x="110" y="108" text-anchor="middle" class="ringnumber">91,3%</text><text x="110" y="132" text-anchor="middle">indexables</text></svg></div><div class="compactlegend">${names.map((n,i)=>`<div><span><i style="background:${colors[i]}"></i>${n}</span><b>${counts[i].toLocaleString('es')}</b><small>${(counts[i]/1248*100).toFixed(1).replace('.',',')}%</small></div>`).join('')}</div><p class="footnote">Indexable no significa indexada en Google.</p></article>`}
function histogram(){const counts=[120,580,310,150,88],labels=['<200','200–399','400–599','600–999','≥1.000'];return `<article class="panel response"><div class="panelhead"><div><h2>Tiempo de respuesta</h2><p class="chartsub">Distribución de 1.248 URL · milisegundos</p></div><span class="metricpill">p50 <b>284 ms</b></span></div><svg viewBox="0 0 470 236" role="img" aria-label="${counts.map((v,i)=>labels[i]+' ms: '+v+' URL').join('; ')}">${[0,200,400,600].map(v=>`<line x1="38" x2="455" y1="${190-v/600*158}" y2="${190-v/600*158}" stroke="var(--line)"/><text x="30" y="${194-v/600*158}" text-anchor="end">${v}</text>`).join('')}${counts.map((v,i)=>`<rect x="${54+i*81}" y="${190-v/600*158}" width="47" height="${v/600*158}" rx="5" fill="${i<3?'var(--blue)':i===3?'var(--amber)':'var(--red)'}" opacity="${i===1?1:.75}"><title>${labels[i]} ms: ${v} URL</title></rect><text x="${77.5+i*81}" y="${180-v/600*158}" text-anchor="middle" class="value">${v}</text><text x="${77.5+i*81}" y="217" text-anchor="middle">${labels[i]}</text>`).join('')}</svg><div class="chartfooter"><span>URL por intervalo · eje vertical desde 0</span><b>p90 · 890 ms</b></div></article>`}
function issueBars(){return `<article class="panel priorities"><div class="panelhead"><div><h2>Problemas detectados</h2><p class="chartsub">URL afectadas · ordenadas por prioridad</p></div><small>Ver detalle ↗</small></div><div class="hbars">${issues.map((i,n)=>`<button class="hbar" onclick="showIssue(${n})" aria-label="${i.name}, ${i.count} URL, prioridad ${i.level}"><div><span>${i.name}</span><strong>${i.count}</strong></div><div class="track"><i style="width:${i.count/40*100}%;background:${['var(--red)','var(--amber)','var(--purple)'][n]}"></i></div><small>${i.level}</small></button>`).join('')}</div><div class="chartfooter"><span>Una URL puede tener varios problemas.</span><span>Escala 0–40</span></div></article>`}
function contentPie(){const counts=[612,324,216,96],names=['Productos','Editorial','Categorías','Otras'],colors=['var(--purple)','var(--blue)','var(--teal)','var(--amber)'];let a=-Math.PI/2;return `<article class="panel types"><div class="panelhead"><div><h2>Tipos de página</h2><p class="chartsub">Cómo se reparte el sitio</p></div><small>1.248 URL</small></div><div class="piewrap"><svg viewBox="0 0 220 220" role="img" aria-label="612 productos, 324 editorial, 216 categorías, 96 otras">${counts.map((n,i)=>{let end=a+n/1248*Math.PI*2;let d=`M110 110 L${110+92*Math.cos(a)} ${110+92*Math.sin(a)} A92 92 0 ${end-a>Math.PI?1:0} 1 ${110+92*Math.cos(end)} ${110+92*Math.sin(end)} Z`;a=end;return `<path d="${d}" fill="${colors[i]}" stroke="var(--panel)" stroke-width="3"><title>${names[i]}: ${n} URL, ${(n/1248*100).toFixed(1)}%</title></path>`}).join('')}</svg><div class="compactlegend">${counts.map((n,i)=>`<div><span><i style="background:${colors[i]}"></i>${names[i]}</span><b>${n}</b><small>${(n/1248*100).toFixed(1).replace('.',',')}%</small></div>`).join('')}</div></div></article>`}
function directories(){const data=[['/productos',550,50,12],['/revista',300,20,4],['/colecciones',200,10,6],['Otras',90,4,2]];return `<article class="panel directories"><div class="panelhead"><div><h2>Cobertura por sección</h2><p class="chartsub">Dónde se concentran las exclusiones y errores</p></div></div><div class="stackrows">${data.map(([name,...n])=>`<div class="stackrow"><span>${name}</span><div class="stackbar" role="img" aria-label="${name}: ${n[0]} indexables, ${n[1]} excluidas, ${n[2]} errores">${n.map((v,i)=>`<i style="width:${v/650*100}%;background:${['var(--green)','var(--amber)','var(--red)'][i]}"><span class="tip">${['Indexables','Excluidas','Errores'][i]} · ${v}</span></i>`).join('')}</div><b>${n.reduce((a,b)=>a+b,0)}</b></div>`).join('')}</div><div class="chartkey"><span><i style="background:var(--green)"></i>Indexables</span><span><i style="background:var(--amber)"></i>Excluidas</span><span><i style="background:var(--red)"></i>Errores</span></div><p class="footnote">Misma escala para todas las secciones · 0–650 URL</p></article>`}
function visualDashboard(){return `<div class="visualgrid">${evolution()}${ring()}${histogram()}${issueBars()}${contentPie()}${directories()}</div>`}
function setPeriod(n){period=n;const node=document.querySelector('.trend');node.outerHTML=evolution()}

function appleView(){return `<div class="apple-frame"><nav class="apple-nav" aria-label="Proyecto"><a href="#apple" class="apple-wordmark">✳ micelio</a><span>estudio.example</span><span class="apple-completed"><i></i> Rastreo completado</span></nav><main class="apple-main"><header class="apple-intro"><div><p class="eyebrow">INFORME DEL SITIO · 18 OCTUBRE 2026</p><h1>La visión completa.<br><span>Lo importante, primero.</span></h1></div><p>1.248 páginas analizadas.<br>Este es el estado de tu sitio.</p></header><section class="apple-overview" aria-labelledby="apple-overview-title"><div class="apple-hero-copy"><h2 id="apple-overview-title">Páginas indexables</h2><div class="apple-hero-number">91,3<span>%</span></div><p class="apple-improvement">↗ 0,2 puntos frente al rastreo anterior</p><p class="apple-hero-description">1.140 páginas permiten su indexación.<br>84 están excluidas y 24 devuelven un error.</p><button class="apple-textbutton" onclick="document.querySelector('.apple-breakdown').open=true;document.querySelector('.apple-breakdown').scrollIntoView({behavior:'smooth',block:'start'})">Explorar la cobertura por sección <span>↗</span></button></div><div class="apple-hero-ring">${ring()}</div><div class="apple-bottomline"><span><b>1.248</b> URL rastreadas</span><span><b>2 min 14 s</b> duración del rastreo</span><small>Indexable no significa indexada en Google.</small></div></section><section class="apple-growth"><div class="apple-growth-copy"><p class="eyebrow">PERSPECTIVA</p><h2>Más páginas.<br>Más cobertura.</h2><div class="apple-growth-number">+370</div><p>páginas indexables<br>desde el 7 de septiembre.</p><span class="apple-growth-note">770 → 1.140 URL<br>Histórico de ejemplo · 7 rastreos</span></div><div class="apple-growth-chart">${evolution()}</div></section><div class="apple-section-title"><div><p class="eyebrow">EL SIGUIENTE PASO</p><h2>Entender. Y mejorar.</h2></div><p>Velocidad y problemas que merecen atención.</p></div><div class="apple-action-grid"><section class="apple-speed"><header><span class="eyebrow">RENDIMIENTO</span><div class="apple-speed-number">284<span>ms</span></div><p>Respuesta mediana <span class="good">· 16 ms menos</span></p></header>${histogram()}</section><section class="apple-fix"><div class="apple-fix-heading"><span class="eyebrow">PRIORIDAD CRÍTICA</span><div class="apple-error-number">24<span>URL</span></div><h2>Recupera los<br>destinos rotos.</h2><p>Actualiza los enlaces que llevan a páginas con error 404.</p><button class="primary" onclick="showIssue(0)">Revisar las páginas <span>↗</span></button></div>${issueBars()}</section></div><details class="apple-breakdown"><summary><span><small>EXPLORAR MÁS</small><strong>Cómo se organiza tu sitio.</strong></span><span class="apple-expand">+</span></summary><div class="apple-breakdown-grid">${contentPie()}${directories()}</div></details><details class="table-disclosure"><summary>Explorar URL afectadas · búsqueda, filtros y exportación ↓</summary>${table()}</details>${rationale()}<footer class="apple-footer">Micelio <span>Datos e histórico ficticios · Propuesta de interfaz</span></footer></main></div>`}

function render(){document.body.className=theme;document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===theme));if(theme==='apple'){document.getElementById('app').innerHTML=appleView();filterRows();return;}document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><b>✳</b>micelio</div><div class="navlabel">ESPACIO DE TRABAJO</div><span class="navitem active">◫ &nbsp; Auditoría</span><span class="navitem">◷ &nbsp; Historial</span><span class="navitem">▦ &nbsp; Programaciones</span><div class="navlabel">HERRAMIENTAS</div><span class="navitem">≋ &nbsp; Logs de servidor</span><span class="navitem">⚙ &nbsp; Ajustes</span><div class="sidefoot">Proyecto de ejemplo<br><strong>estudio.example</strong><br>Motor local · Micelio</div></aside><main><div class="crumb"><span>Proyectos &nbsp;/&nbsp; estudio.example &nbsp;/&nbsp; Auditoría</span><span><span class="dot">●</span> Completado · 18 oct 2026, 10:42</span></div><div class="heading"><div><div class="eyebrow">${theme==='resend'?'Visión general':theme==='router'?'Explorador de diagnósticos':'Tu sitio, de un vistazo'}</div><h1>${theme==='apple'?'Tu sitio, en perspectiva.':theme==='router'?'Analítica del sitio':'Visión general del sitio'}</h1><p>${theme==='apple'?'estudio.example · Una visión completa de tu último rastreo.':'estudio.example <span class="muted">· Rastreo completo · 2 min 14 s</span>'}</p></div><button class="primary" onclick="showIssue(0)">${theme==='apple'?'Revisar errores':'Ver prioridad crítica ↗'}</button></div>${visualStats()}${visualDashboard()}<details class="table-disclosure"><summary>Explorar URL afectadas · búsqueda, filtros y exportación ↓</summary>${table()}</details>${rationale()}</main></div>`;filterRows();}
function setCategory(x){category=x;render()}
function filterRows(){const q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('severity').value;const filtered=rows.filter(r=>r.join(' ').toLowerCase().includes(q)&&(!s||r[4]===s));document.getElementById('resultcount').textContent=filtered.length+' de 6 ejemplos';document.getElementById('rows').innerHTML=filtered.map(r=>'<tr>'+r.map((v,i)=>`<td>${i===1?'<span class="badge '+(v==='404'?'bad':'good')+'">'+v+'</span>':v}</td>`).join('')+'</tr>').join('')||'<tr><td colspan="5" class="empty">No hay resultados. Prueba otra URL o prioridad.</td></tr>';return filtered;}
function showIssue(i){let x=issues[i];document.getElementById('detailbody').innerHTML=`<div class="eyebrow">${x.level} · ${x.count} URL afectadas</div><h2>${x.name}</h2><p>${x.desc}</p><h3>Siguiente acción</h3><p>${x.action}</p><h3>Ejemplos afectados</h3>${x.paths.map(p=>`<p><code>${p}</code> <span class="badge">${x.status}</span></p>`).join('')}<p class="footnote">Muestra ficticia de 2 URL. En producción, el detalle mostraría todas las URL afectadas y sus enlaces de origen.</p>`;document.getElementById('detail').showModal()}
function downloadCSV(){let data=[['URL','HTTP','Indexable','Problema','Prioridad'],...filterRows()];let blob=new Blob(['\uFEFF'+data.map(r=>r.map(v=>'"'+v.replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='micelio-muestra.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;category='Todas';history.replaceState(null,'','#'+theme);render()});if(['resend','router','apple'].includes(location.hash.slice(1)))theme=location.hash.slice(1);render();
</script></body></html>
